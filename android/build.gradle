// Pushizo React Native köprüsü (Android). Yerel SDK: com.pushizo:pushizo-android (sdk/android).
buildscript {
    ext.safeExtGet = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.0.21')}")
    }
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
    // Codegen: package.json "codegenConfig" → NativePushizoSpec (com.pushizo.reactnative).
    apply plugin: "com.facebook.react"
    react {
        root = file("..")
        jsRootDir = file("../src")
        libraryName = "RNPushizoSpec"
        codegenJavaPackageName = "com.pushizo.reactnative"
    }
}

android {
    namespace "com.pushizo.reactnative"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 35)
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ["src/newarch/java"]
            } else {
                java.srcDirs += ["src/oldarch/java"]
            }
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Sürüm, uygulamanın React Native Gradle eklentisi tarafından belirlenir.
    implementation "com.facebook.react:react-android"
    // Monorepo / yerel geliştirme: uygulama settings.gradle'ında ":pushizo" modülü (sdk/android/pushizo) varsa
    // kaynaktan, yoksa yayınlanmış artefakttan (Maven Central veya `gradle publishToMavenLocal`) alınır.
    if (rootProject.findProject(":pushizo") != null) {
        api project(":pushizo")
    } else {
        api "com.pushizo:pushizo-android:0.1.0"
    }
}
